<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Square Path</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; } .container { max-width: 1200px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); } h1 { color: #333; margin-top: 0; } #plot { width: 100%; height: 600px; }</style>
</head>
<body>
  <div class='container'>
    <h1>Square Path</h1>
    <div id="plot"></div>
    <script>
        var trace = {"x": [0, 10, 10, 0, 0], "y": [0, 0, 10, 10, 0], "mode": "lines+markers", "name": "Path", "line": {"color": "blue", "width": 2}, "marker": {"size": 4}};
        var layout = {
            title: 'Square Path',
            xaxis: { title: 'X' },
            yaxis: { title: 'Y', scaleanchor: 'x', scaleratio: 1 },
            hovermode: 'closest'
        };
        Plotly.newPlot('plot', [trace], layout);
    </script>

  </div>
</body>
</html>
